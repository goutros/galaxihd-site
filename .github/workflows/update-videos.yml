name: Update videos
on:
  schedule:
    - cron: "0 20 * * *"   # daily, 06:00 Brisbane
  workflow_dispatch:
  push:
    paths: ["assets/fanart/**"]   # new fanart rebuilds fanart.json
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_videos.py
      - run: python3 update_fanart.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json shorts.json clients.json client_shorts.json stats.json fanart.json
          git diff --cached --quiet || (git commit -m "Update video and fanart lists" && git push)
